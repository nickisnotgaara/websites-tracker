[project]
name = "concurents-tracker"
version = "0.1.0"
description = "Competitor website monitor for new bridal collections"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "openai>=1.0.0",
    "aiogram>=3.0.0",
    "pydantic-settings>=2.0.0",
    "loguru>=0.7.0",
    "sqlitedict>=2.1.0",
    "tenacity>=8.0.0",
    "python-dotenv>=1.0.0",
    "apscheduler>=3.11.2",
    "pytz>=2025.2",
    "google-api-python-client>=2.188.0",
    "google-auth-httplib2>=0.3.0",
    "google-auth-oauthlib>=1.2.4",
    "trafilatura>=2.0.0",
    "selectolax>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
[dependency-groups]
dev = ["pytest>=8.0"]
